# While the Docker images themselves are supported for production usage,
# this docker-compose.yaml is designed to be used by developers to run
# an environment locally. It is not designed to be used in production.
# We recommend to use Kubernetes in production with our Helm Charts:
# https://docs.camunda.io/docs/self-managed/setup/install/
# For local development, we recommend using KIND instead of `docker-compose`:
# https://docs.camunda.io/docs/self-managed/setup/deploy/local/local-kubernetes-cluster/

# This is a lightweight configuration with Orchestration (Zeebe + Operate + Tasklist) only.
# Connectors was dropped (2026-09-07) — this project's BPMN process doesn't use any connector
# tasks, so the ~450MB it was actually using (of its 512MB mem_limit) was pure overhead on an
# already memory-tight machine. Re-add the `connectors` service below (see git history) if a
# future process needs an outbound/inbound connector.
# See docker-compose-full.yaml for a configuration that also includes Optimize, Identity, Keycloak, Web Modeler, and Console.
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Consolidated Zeebe + Operate + Tasklist - https://docs.camunda.io/docs/self-managed/setup/deploy/other/docker/#zeebe
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS="-XX:+PrintFlagsFinal"
    env_file:
      - path: .env
        required: true
    # Bumped 1g -> 2g -> 2.5g: under memory pressure a JVM GC pause can block
    # the single-threaded stream processor long enough to blow past engine
    # timeouts (e.g. a gateway FEEL expression "timed out after 5000 ms"),
    # which surfaces as a spurious incident with no underlying data problem.
    # See RUNNING-LOCALLY.md's "watch out" note for this container.
    mem_limit: 2560m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./driver-lib:/driver-lib:ro
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:

networks:
  camunda:
    name: camunda

configs:
  orchestration-config:
    file: ./configuration/${ORCHESTRATION_CONFIG_FILE:-application-h2.yaml}
